name: Build & Release PawedCat APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts & Checksums
        run: |
          mkdir -p build-artifacts

          # Determine version name
          VERSION="${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            PROP_VER=$(grep "app.version.name" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n' || echo "1.3.0")
            VERSION="v${PROP_VER}"
          fi

          echo "Packaging APKs for version: $VERSION"

          # Permanent shareable name for direct download links:
          # https://github.com/erreur404/pawedCat/releases/latest/download/PawedCat.apk
          cp app/build/outputs/apk/release/app-release.apk build-artifacts/PawedCat.apk

          # Versioned name for clear identification when downloaded:
          cp app/build/outputs/apk/release/app-release.apk "build-artifacts/PawedCat-${VERSION}.apk"

          # Release alias for backwards compatibility:
          cp app/build/outputs/apk/release/app-release.apk build-artifacts/PawedCat-release.apk

          # Generate SHA-256 checksums
          cd build-artifacts
          sha256sum PawedCat.apk "PawedCat-${VERSION}.apk" PawedCat-release.apk > SHA256SUMS.txt
          cd ..

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawedCat-APK
          path: build-artifacts/*
          retention-days: 30

      - name: Publish APK Assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/PawedCat.apk
            build-artifacts/PawedCat-*.apk
            build-artifacts/SHA256SUMS.txt
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
          name: ${{ github.event.release.name || (startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name)) || inputs.tag_name || format('Release {0}', github.ref_name) }}
          draft: false
          prerelease: false
          generate_release_notes: true
